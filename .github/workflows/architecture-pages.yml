name: Publish architecture explorer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Stage only the public architecture assets
        run: |
          mkdir -p _site/architecture-view/vendor _site/assets
          cp docs/architecture-view/index.html docs/architecture-view/styles.css docs/architecture-view/app.js docs/architecture-view/data.js docs/architecture-view/models.js docs/architecture-view/export-stl.js _site/architecture-view/
          cp docs/architecture-view/vendor/* _site/architecture-view/vendor/
          cp docs/assets/architecture.png _site/assets/
          cp docs/architecture-view/landing.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
