[project]
name = "prompt-enhance-mcp"
version = "0.1.0"
description = "MCP server exposing Prompt Enhance tools to Codex"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]

[project.scripts]
prompt-enhance-mcp = "prompt_enhance_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prompt_enhance_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
